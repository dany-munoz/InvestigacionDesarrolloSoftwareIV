<div class="login-wrapper">
    <div class="login-card">
        <h1 class="logo-text">TodoApp</h1>
        <h2 class="page-title">Iniciar sesión</h2>

        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form">

            <div class="form-group">
                <label for="userName">Usuario</label>
                <input id="userName" type="text" formControlName="userName" autocomplete="username" class="form-control"
                    placeholder="usuario" />

                @if (form.controls.userName.invalid && form.controls.userName.touched) {
                <p class="field-error">El usuario es requerido</p>
                }
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input id="password" type="password" formControlName="password" autocomplete="current-password"
                    class="form-control" placeholder="********" />

                @if (form.controls.password.invalid && form.controls.password.touched) {
                <p class="field-error">La contraseña es requerida</p>
                }
            </div>

            @if (errorMessage()) {
            <p class="global-error">{{ errorMessage() }}</p>
            }

            <button type="submit" class="btn-primary" [disabled]="form.invalid">Ingresar</button>

        </form>

        <p class="back-link">
            <a routerLink="/">Volver al inicio</a>
        </p>
    </div>
</div>
